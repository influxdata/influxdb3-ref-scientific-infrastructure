# Telegraf agent for the `compute` node.
#
# Everything this node ships is synthetic (inputs.mock random) except uptime,
# which is the real inputs.system reading. The point of the file is the
# filtering and reshaping between the inputs and the output:
#
#   fieldinclude   keep only the fields the schema wants, drop the noisy ones
#   rename         map plugin naming to this repo's conventions
#   namepass       the output ships only the five canonical measurements
#   taginclude     the output keeps only the `host` tag
#
# ARCHITECTURE.md has the full "what is dropped where" table. The `storage`
# node runs the same file with a different hostname and value ranges.

[agent]
  interval = "1s"           # collect every second
  round_interval = true
  flush_interval = "1s"     # write every second
  flush_jitter = "0s"
  ## Keep full nanosecond timestamps. The default ("0s") rounds collected
  ## timestamps to the interval's order of magnitude, capped at 1s, so with
  ## a 1s interval every timestamp would land on a whole second.
  precision = "1ns"
  hostname = "compute"
  omit_hostname = false
  skip_processors_after_aggregators = true   # future default; no aggregators here

# ── inputs ───────────────────────────────────────────────────────────────

# CPU. Mimics inputs.cpu (totalcpu): several usage_* fields plus a `cpu`
# tag. Only usage_active is kept; the tag is stripped at the output.
[[inputs.mock]]
  metric_name = "cpu"
  fieldinclude = ["usage_active"]
  [inputs.mock.tags]
    cpu = "cpu-total"
  [[inputs.mock.random]]
    name = "usage_active"
    min = 40.0
    max = 75.0
  [[inputs.mock.random]]
    name = "usage_user"
    min = 20.0
    max = 50.0
  [[inputs.mock.random]]
    name = "usage_system"
    min = 5.0
    max = 20.0
  [[inputs.mock.random]]
    name = "usage_iowait"
    min = 0.0
    max = 5.0
  [[inputs.mock.random]]
    name = "usage_steal"
    min = 0.0
    max = 1.0

# Load. Already in the canonical shape.
[[inputs.mock]]
  metric_name = "load"
  [[inputs.mock.random]]
    name = "load1"
    min = 1.0
    max = 4.0
  [[inputs.mock.random]]
    name = "load5"
    min = 1.0
    max = 4.0
  [[inputs.mock.random]]
    name = "load15"
    min = 1.0
    max = 4.0

# Memory. Mimics inputs.mem: keep used_percent, drop the rest.
[[inputs.mock]]
  metric_name = "mem"
  fieldinclude = ["used_percent"]
  [[inputs.mock.random]]
    name = "used_percent"
    min = 50.0
    max = 70.0
  [[inputs.mock.random]]
    name = "available_percent"
    min = 30.0
    max = 50.0
  [[inputs.mock.random]]
    name = "cached_percent"
    min = 5.0
    max = 15.0

# Temperature. Mimics inputs.temp (measurement "temp", field "temp", tag
# "sensor"); renamed to temperature.temp_c below, sensor stripped at output.
[[inputs.mock]]
  metric_name = "temp"
  [inputs.mock.tags]
    sensor = "coretemp_package_id_0"
  [[inputs.mock.random]]
    name = "temp"
    min = 45.0
    max = 60.0

# Uptime. The real system reading. The legacy layout emits load1/5/15,
# n_cpus, n_users, uptime and uptime_format; keep only uptime.
[[inputs.system]]
  fieldinclude = ["uptime"]

# Process counts. Collected on purpose and never shipped: the output's
# namepass drops the whole measurement. Stands in for the extra inputs a
# stock telegraf.conf tends to carry.
[[inputs.processes]]

# ── reshaping ────────────────────────────────────────────────────────────

[[processors.rename]]
  [[processors.rename.replace]]
    measurement = "temp"
    dest = "temperature"
  [[processors.rename.replace]]
    field = "temp"
    dest = "temp_c"
  [[processors.rename.replace]]
    measurement = "system"
    dest = "uptime"

# ── output ───────────────────────────────────────────────────────────────

[[outputs.influxdb_v2]]
  urls = ["http://influxdb3:8181"]   # InfluxDB 3 serves the v2 write API
  token = "${INFLUX_TOKEN}"          # exported by the container command
  organization = ""                  # ignored by InfluxDB 3
  bucket = "sci"                     # the database
  ## The write contract: only the canonical measurements leave this agent,
  ## and only the host tag goes with them.
  namepass = ["cpu", "load", "mem", "temperature", "uptime"]
  taginclude = ["host"]
