# Telegraf agent for the `daq` node.
#
# CPU, load and memory arrive from collectd over the binary network protocol
# (UDP 25826, see collectd/collectd.conf); temperature is inputs.mock (same
# block as the other nodes) and uptime is the real inputs.system reading.
# In "join" mode Telegraf names each collectd measurement after the plugin
# (collectd_cpu, collectd_load, collectd_memory), puts the value(s) in fields
# named by types.db (value, or shortterm/midterm/longterm), and carries the
# host/type/type_instance/instance tags — the filters and renames below map
# all of that onto the same schema the mock nodes write:
#
#   tagpass        tag-VALUE allowlist on the collectd input (cpu/active,
#                  memory/used, load); collectd multiplexes one measurement
#                  across type_instance values, so this has to happen before
#                  the tags are stripped
#   fieldinclude   keep only the fields the schema wants
#   rename         one scoped block per collectd measurement
#   namepass       the output ships only the five canonical measurements
#   taginclude     the output keeps only the `host` tag
#
# ARCHITECTURE.md has the full "what is dropped where" table.

[agent]
  interval = "1s"
  round_interval = true
  flush_interval = "1s"
  flush_jitter = "0s"
  ## Keep full nanosecond timestamps (default rounds to whole seconds at a
  ## 1s interval). collectd is a service input: its own high-resolution
  ## timestamps pass through untouched.
  precision = "1ns"
  hostname = "daq"
  omit_hostname = false
  skip_processors_after_aggregators = true   # future default; no aggregators here

# ── inputs ───────────────────────────────────────────────────────────────

[[inputs.socket_listener]]
  service_address = "udp://:25826"
  data_format = "collectd"
  collectd_typesdb = ["/etc/telegraf/types.db"]
  ## "join": one metric per collectd value list, multi-value types become
  ## multiple fields (load → shortterm/midterm/longterm).
  collectd_parse_multivalue = "join"
  collectd_security_level = "none"
  ## Make the origin obvious in the pre-rename names (collectd_cpu, …).
  name_prefix = "collectd_"
  ## Tag-value allowlist, OR across keys. Keeps cpu/percent-active,
  ## memory/percent-used and load; drops memory free/cached/buffered/slab_*,
  ## uptime and interface (no type_instance). collectd_df{type_instance=used}
  ## slips through here and is caught by the output namepass.
  [inputs.socket_listener.tagpass]
    type_instance = ["active", "used"]
    type = ["load"]

# Temperature. Same block as the mock nodes (no thermal zones in Docker
# Desktop's VM; swap for inputs.temp on a Linux host with sensors).
[[inputs.mock]]
  metric_name = "temp"
  [inputs.mock.tags]
    sensor = "coretemp_package_id_0"
  [[inputs.mock.random]]
    name = "temp"
    min = 20.0
    max = 30.0

# Uptime. The real system reading; keep only the uptime field.
[[inputs.system]]
  fieldinclude = ["uptime"]

# ── reshaping: one scoped rename block per collectd measurement ─────────
# A field rename applies to every metric that has the field, so each block
# is limited (namepass) to the measurement it is meant for.

[[processors.rename]]
  namepass = ["collectd_cpu"]           # collectd_cpu{type=percent,type_instance=active} value=…
  [[processors.rename.replace]]
    field = "value"
    dest = "usage_active"
  [[processors.rename.replace]]
    measurement = "collectd_cpu"
    dest = "cpu"

[[processors.rename]]
  namepass = ["collectd_load"]          # collectd_load{type=load} shortterm=…,midterm=…,longterm=…
  [[processors.rename.replace]]
    field = "shortterm"
    dest = "load1"
  [[processors.rename.replace]]
    field = "midterm"
    dest = "load5"
  [[processors.rename.replace]]
    field = "longterm"
    dest = "load15"
  [[processors.rename.replace]]
    measurement = "collectd_load"
    dest = "load"

[[processors.rename]]
  namepass = ["collectd_memory"]        # collectd_memory{type=percent,type_instance=used} value=…
  [[processors.rename.replace]]
    field = "value"
    dest = "used_percent"
  [[processors.rename.replace]]
    measurement = "collectd_memory"
    dest = "mem"

[[processors.rename]]
  namepass = ["temp", "system"]
  [[processors.rename.replace]]
    measurement = "temp"
    dest = "temperature"
  [[processors.rename.replace]]
    field = "temp"
    dest = "temp_c"
  [[processors.rename.replace]]
    measurement = "system"
    dest = "uptime"

# ── output ───────────────────────────────────────────────────────────────

[[outputs.influxdb_v2]]
  urls = ["http://influxdb3:8181"]
  token = "${INFLUX_TOKEN}"
  organization = ""
  bucket = "sci"
  ## The write contract: only the canonical measurements leave this agent,
  ## and only the host tag goes with them (collectd's type/type_instance/
  ## instance tags are stripped here).
  namepass = ["cpu", "load", "mem", "temperature", "uptime"]
  taginclude = ["host"]
