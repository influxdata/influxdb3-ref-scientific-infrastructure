# collectd on the DAQ node. Samples once per second (matching Telegraf) and
# ships everything over the binary network protocol to the DAQ Telegraf
# agent, which does the filtering and reshaping (telegraf/daq.conf).

Hostname "daq"
FQDNLookup false
Interval 1
Timeout 2
ReadThreads 2
WriteThreads 2

LoadPlugin logfile
<Plugin logfile>
  LogLevel info
  File STDERR
  Timestamp true
</Plugin>

# CPU as one aggregate percentage: daq/cpu/percent-active.
LoadPlugin cpu
<Plugin cpu>
  ReportByCpu false
  ReportByState false
  ValuesPercentage true
</Plugin>

# Load: daq/load/load with shortterm, midterm, longterm.
LoadPlugin load

# Memory as percentages: daq/memory/percent-{used,free,cached,buffered,
# slab_recl,slab_unrecl}. Telegraf keeps only `used`.
LoadPlugin memory
<Plugin memory>
  ValuesAbsolute false
  ValuesPercentage true
</Plugin>

# Sent on purpose and dropped by Telegraf: uptime is standardised on
# Telegraf's inputs.system on every node; interface and df are noise here.
LoadPlugin uptime
LoadPlugin interface
LoadPlugin df
<Plugin df>
  MountPoint "/"
  IgnoreSelected false
  ValuesAbsolute false
  ValuesPercentage true
</Plugin>

LoadPlugin network
<Plugin network>
  Server "telegraf-daq" "25826"
</Plugin>
